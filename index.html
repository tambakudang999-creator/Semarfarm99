<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semar Farm</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a2a22">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #1f1f1f;
    }
    body {
      min-height: 100vh;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      background: linear-gradient(135deg, #0a7a3d 0%, #1a9a52 100%);
      color: white;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .topbar h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
    }
    .sub {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 6px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .panel {
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .panel h2 {
      margin: 0 0 16px 0;
      font-size: 1.2rem;
      color: #0a7a3d;
    }
    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .field-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    input, button {
      height: 42px;
      border-radius: 8px;
      border: 1px solid #d0d0d0;
      font-size: 0.95rem;
      padding: 0 12px;
    }
    input:focus {
      outline: none;
      border-color: #0a7a3d;
      box-shadow: 0 0 0 3px rgba(10,122,61,0.12);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
    }
    .primary {
      background: #0a7a3d;
      color: white;
    }
    .secondary {
      background: #f4a460;
      color: #1f1f1f;
    }
    .danger {
      background: #d9534f;
      color: white;
    }
    .data-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e9e9e9;
      border-radius: 8px;
      padding: 12px 14px;
      background: #fafafa;
    }
    .item .meta {
      line-height: 1.5;
    }
    .item strong {
      display: block;
      margin-bottom: 3px;
      color: #0a2a22;
    }
    .item small {
      color: #666;
    }
    .empty {
      text-align: center;
      color: #777;
      padding: 24px 10px;
      border: 1px dashed #d5d5d5;
      border-radius: 8px;
      background: #fafafa;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 18px 12px;
      text-align: center;
    }
    .stat-box h3 {
      margin: 0 0 10px 0;
      font-size: 0.85rem;
      color: #5f5f5f;
      font-weight: 600;
    }
    .stat-box .num {
      font-size: 1.8rem;
      color: #0a7a3d;
      font-weight: 700;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .status {
      margin-top: 10px;
      color: #444;
      font-size: 0.9rem;
    }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .field-grid, .field-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <h1>Semar Farm</h1>
      <div class="sub">Dashboard Kelola Kolam & Anak Kolam</div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="row">
      <div class="panel">
        <h2>Tambah Kolam</h2>
        <div class="field-grid">
          <input id="kolam_name" type="text" placeholder="Nama Kolam">
          <input id="kolam_size" type="number" placeholder="Ukuran (m²)">
          <input id="kolam_type" type="text" placeholder="Jenis Ikan">
          <button class="primary" onclick="addKolam()">Tambah</button>
        </div>
      </div>

      <div class="panel">
        <h2>Tambah Anak Kolam</h2>
        <div class="field-grid-2">
          <input id="anak_name" type="text" placeholder="Nama Anak Kolam">
          <input id="anak_parent" type="text" placeholder="Kolam Induk">
          <input id="anak_jumlah" type="number" placeholder="Jumlah Ikan">
          <button class="primary" onclick="addAnakKolam()">Tambah</button>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="panel">
        <h2>Daftar Kolam</h2>
        <div id="kolamList" class="data-list"></div>
      </div>

      <div class="panel">
        <h2>Daftar Anak Kolam</h2>
        <div id="anakKolamList" class="data-list"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Pengaturan</h2>
      <div class="toolbar">
        <button class="secondary" onclick="enableNotifications()">Aktifkan Notifikasi</button>
        <button class="secondary" onclick="exportCSV()">Export Data CSV</button>
        <button class="danger" onclick="clearAllData()">Hapus Semua Data</button>
      </div>
      <div class="status">Status: <span id="statusText">Menyiapkan koneksi...</span></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdXQ9kioYsleUKiWr_IGnpphqcWFpWSyk",
      authDomain: "semar-farm99.firebaseapp.com",
      databaseURL: "https://semar-farm99-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "semar-farm99",
      storageBucket: "semar-farm99.firebasestorage.app",
      messagingSenderId: "1073074828029",
      appId: "1:1073074828029:web:1368f02343a4ee44288494",
      measurementId: "G-KC6JEZGM5Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messaging = getMessaging(app);

    let kolamData = [];
    let anakKolamData = [];

    function updateStats() {
      const totalKolam = kolamData.length;
      const totalAnakKolam = anakKolamData.length;
      const totalIkan = anakKolamData.reduce((sum, item) => sum + Number(item.jumlah || 0), 0);
      const totalLuas = kolamData.reduce((sum, item) => sum + Number(item.size || 0), 0);

      document.getElementById('stats').innerHTML = `
        <div class="stat-box"><h3>Total Kolam</h3><div class="num">${totalKolam}</div></div>
        <div class="stat-box"><h3>Total Anak Kolam</h3><div class="num">${totalAnakKolam}</div></div>
        <div class="stat-box"><h3>Total Ikan</h3><div class="num">${totalIkan}</div></div>
        <div class="stat-box"><h3>Total Luas</h3><div class="num">${totalLuas}</div></div>
      `;
    }

    function renderKolam() {
      const list = document.getElementById('kolamList');
      if (!kolamData.length) {
        list.innerHTML = '<div class="empty">Belum ada data kolam</div>';
        return;
      }
      list.innerHTML = kolamData.map(item => `
        <div class="item">
          <div class="meta">
            <strong>${item.name}</strong>
            <small>Ukuran: ${item.size || 0} m²</small><br>
            <small>Jenis: ${item.type || '-'}</small><br>
            <small>Status: ${item.status || 'Aktif'}</small>
          </div>
          <button class="danger" onclick="deleteKolam('${item.id}')">Hapus</button>
        </div>
      `).join('');
    }

    function renderAnakKolam() {
      const list = document.getElementById('anakKolamList');
      if (!anakKolamData.length) {
        list.innerHTML = '<div class="empty">Belum ada data anak kolam</div>';
        return;
      }
      list.innerHTML = anakKolamData.map(item => `
        <div class="item">
          <div class="meta">
            <strong>${item.name}</strong>
            <small>Kolam Induk: ${item.parent || '-'}</small><br>
            <small>Jumlah: ${item.jumlah || 0}</small><br>
            <small>Status: ${item.status || 'Hidup'}</small>
          </div>
          <button class="danger" onclick="deleteAnakKolam('${item.id}')">Hapus</button>
        </div>
      `).join('');
    }

    function loadKolam() {
      onValue(ref(db, 'kolam'), (snapshot) => {
        kolamData = [];
        const data = snapshot.val() || {};
        Object.keys(data).forEach(id => kolamData.push({ id, ...data[id] }));
        renderKolam();
        updateStats();
      });
    }

    function loadAnakKolam() {
      onValue(ref(db, 'anak_kolam'), (snapshot) => {
        anakKolamData = [];
        const data = snapshot.val() || {};
        Object.keys(data).forEach(id => anakKolamData.push({ id, ...data[id] }));
        renderAnakKolam();
        updateStats();
      });
    }

    window.addKolam = async function() {
      const name = document.getElementById('kolam_name').value.trim();
      const size = document.getElementById('kolam_size').value.trim();
      const type = document.getElementById('kolam_type').value.trim();
      if (!name || !size || !type) {
        alert('Semua field kolam harus diisi');
        return;
      }
      try {
        await push(ref(db, 'kolam'), {
          name, size: Number(size), type, status: 'Aktif', created_at: new Date().toISOString()
        });
        document.getElementById('kolam_name').value = '';
        document.getElementById('kolam_size').value = '';
        document.getElementById('kolam_type').value = '';
        alert('Kolam berhasil ditambahkan');
      } catch (error) {
        alert('Gagal menambah kolam: ' + error.message);
      }
    };

    window.addAnakKolam = async function() {
      const name = document.getElementById('anak_name').value.trim();
      const parent = document.getElementById('anak_parent').value.trim();
      const jumlah = document.getElementById('anak_jumlah').value.trim();
      if (!name || !parent || !jumlah) {
        alert('Semua field anak kolam harus diisi');
        return;
      }
      try {
        await push(ref(db, 'anak_kolam'), {
          name, parent, jumlah: Number(jumlah), status: 'Hidup', created_at: new Date().toISOString()
        });
        document.getElementById('anak_name').value = '';
        document.getElementById('anak_parent').value = '';
        document.getElementById('anak_jumlah').value = '';
        alert('Anak kolam berhasil ditambahkan');
      } catch (error) {
        alert('Gagal menambah anak kolam: ' + error.message);
      }
    };

    window.deleteKolam = async function(id) {
      if (!confirm('Hapus kolam ini?')) return;
      try {
        await remove(ref(db, `kolam/${id}`));
      } catch (error) {
        alert('Gagal menghapus kolam: ' + error.message);
      }
    };

    window.deleteAnakKolam = async function(id) {
      if (!confirm('Hapus anak kolam ini?')) return;
      try {
        await remove(ref(db, `anak_kolam/${id}`));
      } catch (error) {
        alert('Gagal menghapus anak kolam: ' + error.message);
      }
    };

    window.enableNotifications = async function() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const token = await getToken(messaging, { vapidKey: 'BG2VmDdZ7jfGxrI3cXl5lX0wZ5xZ6kL9mN2pQ7rS9sT0uV1wX3yZ4aB5cD6eF7gH8iJ9kL0mN1oP2qR3sT4uV5wX6yZ7aB8cD9eF0gH1iJ2kL3mN4oP5qR6sT7uV8wX9yZ' });
          localStorage.setItem('fcm_token', token);
          document.getElementById('statusText').textContent = 'Notifikasi aktif';
          alert('Notifikasi aktif');
        } else {
          alert('Izin notifikasi ditolak');
        }
      } catch (err) {
        console.log('Notif error:', err);
        alert('Gagal mengaktifkan notifikasi');
      }
    };

    window.exportCSV = function() {
      let csv = 'Nama Kolam,Ukuran (m²),Jenis Ikan,Status\n';
      kolamData.forEach(item => {
        csv += `${item.name},${item.size || 0},${item.type || ''},${item.status || 'Aktif'}\n`;
      });
      csv += '\nNama Anak Kolam,Kolam Induk,Jumlah Ikan,Status\n';
      anakKolamData.forEach(item => {
        csv += `${item.name},${item.parent || ''},${item.jumlah || 0},${item.status || 'Hidup'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'semar-farm-export.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    window.clearAllData = async function() {
      if (!confirm('Yakin ingin menghapus semua data?')) return;
      try {
        for (const item of kolamData) await remove(ref(db, `kolam/${item.id}`));
        for (const item of anakKolamData) await remove(ref(db, `anak_kolam/${item.id}`));
        alert('Semua data berhasil dihapus');
      } catch (err) {
        alert('Gagal menghapus data: ' + err.message);
      }
    };

    onMessage(messaging, (payload) => {
      const title = payload.notification?.title || 'Semar Farm';
      const body = payload.notification?.body || 'Ada update baru';
      if (Notification.permission === 'granted') {
        new Notification(title, { body, icon: '🌾' });
      }
      console.log('FCM payload received:', payload);
    });

    loadKolam();
    loadAnakKolam();
    document.getElementById('statusText').textContent = 'Terhubung ke Firebase';

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./firebase-messaging-sw.js').catch(err => console.log('SW error:', err));
    }
  </script>
</body>
</html>
